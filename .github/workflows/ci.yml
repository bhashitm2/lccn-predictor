name: CI

# Nothing ran the test suite on push or PR before this: the other two workflows
# are schedule/dispatch-only crawlers. A `main` that crashed partway through a
# prediction therefore merged clean and was only caught by a 15-minute
# production crawl. This runs the tests where they can block that instead.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # DELIBERATELY HARDCODED — do not change to ${{ vars.CRAWLER_RUNNER }}.
    #
    # This repo is PUBLIC and this workflow runs on `pull_request`, so a fork PR
    # can trigger it. Pointing it at a self-hosted runner would let anyone
    # execute arbitrary code on that machine by opening a PR. The crawl
    # workflows can take a self-hosted runner precisely because `schedule` and
    # `workflow_dispatch` are not fork-triggerable; this one is.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt
      - name: Run tests
        # The suite is fully offline (the crawler runs against a stub session),
        # so it never touches LeetCode or MongoDB Atlas.
        run: pytest -q
