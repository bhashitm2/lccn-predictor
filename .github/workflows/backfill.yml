name: Backfill past contests

# One-off historical populate: predicts the N most recently finished contests and
# writes them to Atlas. Run manually from the Actions tab.
#
# NOTE: for contests LeetCode has already officially rated, the computed deltas are
# illustrative (derived from current/post-contest ratings), not true forecasts.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many recent contests to backfill"
        required: false
        default: "10"
      limit:
        description: "Top-N per contest (blank = full field)"
        required: false
      force:
        description: "Re-predict even if already done (true/false)"
        required: false
        default: "false"

concurrency:
  group: crawl-predict      # share the lock with crawl-cron so they never overlap
  cancel-in-progress: false

jobs:
  backfill:
    # Runner is selectable via the CRAWLER_RUNNER repo variable so the crawl can
    # move to a dedicated IP without a code change. Unset => empty string =>
    # falls back to ubuntu-latest, so nothing changes until you set it.
    #
    # SAFE HERE, AND ONLY HERE: this workflow is reachable only by
    # `workflow_dispatch`, which a fork cannot trigger. This repo is
    # PUBLIC, so any workflow a fork *can* trigger (i.e. ci.yml, on
    # pull_request) must never run on a self-hosted runner — a fork PR would
    # execute arbitrary code on your box. Do not "tidy" this into a shared value.
    runs-on: ${{ vars.CRAWLER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt
      - name: Backfill
        env:
          LCCN_MONGODB_URI: ${{ secrets.LCCN_MONGODB_URI }}
          LCCN_DB_NAME: lccn_predictor
          # Gentler crawl to avoid Cloudflare throttling on full contests. The
          # rate limit — not the concurrency — is what actually bounds our
          # request rate once the edge starts refusing; see crawl-cron.yml.
          LCCN_RANKING_CONCURRENCY: "4"
          LCCN_RATING_CONCURRENCY: "6"
          LCCN_HTTP_RATE_LIMIT_PER_SECOND: "5"
          LCCN_HTTP_RETRY: "5"
          LCCN_HTTP_BLOCK_COOLDOWN_SECONDS: "90"
          COUNT: ${{ github.event.inputs.count }}
          LIMIT: ${{ github.event.inputs.limit }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ARGS="--count ${COUNT:-10}"
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          python -m predictor.cli backfill $ARGS
