name: Crawl & predict latest contest

# The crawler runs HERE, not on the web host, because it needs an IP that
# LeetCode's Cloudflare edge will serve. It writes predictions straight to
# MongoDB Atlas; the deployed API then serves those cached results.
#
# On a GitHub-hosted runner that is a COIN FLIP, not a guarantee. Runners draw
# from Azure ranges shared with every CI user on the internet, and Cloudflare
# scores them accordingly: observed runs have been roughly 50/50, and a refused
# run is refused on the very first request, before any pacing can help. Set the
# CRAWLER_RUNNER repo variable to move this onto a dedicated IP — see
# docs/self-hosted-runner.md.
#
# Required repository secret:
#   LCCN_MONGODB_URI   the same MongoDB Atlas connection string the web host uses
#
# Times are UTC. LeetCode weekly ends ~04:00 UTC Sun; biweekly ~16:00 UTC Sat.
# Re-runs are no-ops once the latest contest is already predicted.
#
# Four schedules: one crawl right after each contest type ends, and one forced
# re-crawl ~24h later once LeetCode's cheater purge and rating updates have
# settled. Transient failures are handled in-process by fetch_ranking's repair
# passes, which keep every page already fetched — deliberately NOT by extra cron
# entries or job-level retries, both of which restart the crawl from page 1.
on:
  schedule:
    - cron: "30 4 * * 0"    # weekly:   ~30m after it ends
    - cron: "0 4 * * 1"     # weekly:   ~+24h, forced re-crawl (post-purge, final)
    - cron: "30 16 * * 6"   # biweekly: ~30m after it ends
    - cron: "0 16 * * 0"    # biweekly: ~+24h, forced re-crawl (post-purge, final)
  workflow_dispatch:
    inputs:
      slug:
        description: "Contest slug (blank = latest finished)"
        required: false
      limit:
        description: "Top-N only (blank = full contest)"
        required: false
      force:
        description: "Re-predict even if already done (true/false)"
        required: false
        default: "false"

concurrency:
  group: crawl-predict
  cancel-in-progress: false

jobs:
  crawl:
    # Runner is selectable via the CRAWLER_RUNNER repo variable so the crawl can
    # move to a dedicated IP without a code change. Unset => empty string =>
    # falls back to ubuntu-latest, so nothing changes until you set it.
    #
    # SAFE HERE, AND ONLY HERE: this workflow is reachable only by `schedule`
    # and `workflow_dispatch`, neither of which a fork can trigger. This repo is
    # PUBLIC, so any workflow a fork *can* trigger (i.e. ci.yml, on
    # pull_request) must never run on a self-hosted runner — a fork PR would
    # execute arbitrary code on your box. Do not "tidy" this into a shared value.
    runs-on: ${{ vars.CRAWLER_RUNNER || 'ubuntu-latest' }}
    # A full contest is ~1,600 ranking pages at a deliberately polite rate
    # (~9 min), plus ratings and the Elo compute — a healthy run is ~20 min.
    # The cap is sized for the unhealthy case: worst-case in-process patience
    # is ~65 min of breaker cooldowns and repair-pass waits, and being killed
    # mid-recovery would discard every page already fetched.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install --quiet -r requirements.txt
      - name: Crawl + predict
        env:
          LCCN_MONGODB_URI: ${{ secrets.LCCN_MONGODB_URI }}
          LCCN_DB_NAME: lccn_predictor
          # Politeness settings. Concurrency alone does NOT bound the request
          # rate: once Cloudflare starts refusing, a 403 comes back from the
          # edge in ~20ms, so 8 concurrent slots became hundreds of requests a
          # second and ~25,000 requests per run. The rate limit is the real
          # control; the circuit breaker stops us hammering a closed door.
          LCCN_RANKING_CONCURRENCY: "4"
          LCCN_RATING_CONCURRENCY: "6"
          # 3/s is tuned for a shared, already-suspect GitHub IP. On a
          # dedicated runner set CRAWLER_RATE_LIMIT to ~8 (a full crawl drops
          # from ~9 min to ~3.5). Everything below it protects data integrity,
          # not the IP, and should be left alone.
          LCCN_HTTP_RATE_LIMIT_PER_SECOND: ${{ vars.CRAWLER_RATE_LIMIT || '3' }}
          LCCN_HTTP_RETRY: "5"
          LCCN_HTTP_BLOCK_THRESHOLD: "12"
          LCCN_HTTP_BLOCK_COOLDOWN_SECONDS: "300"
          LCCN_HTTP_MAX_COOLDOWNS: "3"
          LCCN_REPAIR_PASSES: "2"
          LCCN_REPAIR_PASS_COOLDOWN_SECONDS: "600"
          SLUG: ${{ github.event.inputs.slug }}
          LIMIT: ${{ github.event.inputs.limit }}
          FORCE: ${{ github.event.inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # late scheduled re-crawls force a re-predict (contest is already "done")
          case "$SCHEDULE" in
            "0 4 * * 1"|"0 16 * * 0") FORCE="true" ;;
          esac
          ARGS=""
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          if [ -n "$SLUG" ]; then
            set -- predict "$SLUG" $ARGS
          else
            set -- predict-latest $ARGS
          fi

          # Deliberately ONE attempt. An earlier version retried the whole
          # command up to 3x, which restarts the crawl at page 1 and throws
          # away every page already fetched — so a *blocked* run issued three
          # full ~1,600-page crawls, tripling the load at exactly the moment
          # LeetCode had told us to back off. Retrying is not free here; it is
          # what deepens the block.
          #
          # Transient failures are handled in-process instead, by the repair
          # passes in fetch_ranking, which keep every page already in hand.
          # A block that outlasts those is an IP-reputation problem that no
          # amount of retrying inside one job will fix — it needs hours, so the
          # next scheduled run is the right place to pick it up.
          set +e
          python -m predictor.cli "$@"
          code=$?
          set -e
          if [ $code -eq 0 ]; then
            exit 0
          fi
          if [ $code -eq 75 ]; then
            echo "::error::blocked by LeetCode/Cloudflare (exit 75). Existing predictions were left untouched. Do NOT re-run immediately — that deepens the block; wait for the next scheduled crawl."
          else
            echo "::error::crawl failed with exit code $code (not a transient block)"
          fi
          exit $code
