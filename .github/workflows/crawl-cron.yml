name: Crawl & predict latest contest

# The crawler runs HERE (GitHub Actions), not on the web host: a runner's IP can
# reach LeetCode's Cloudflare-protected ranking API via curl_cffi, whereas many
# cloud hosts (e.g. Render) get 403'd. It writes predictions straight to MongoDB
# Atlas; the deployed API then serves those cached results.
#
# Required repository secret:
#   LCCN_MONGODB_URI   the same MongoDB Atlas connection string the web host uses
#
# Times are UTC. LeetCode weekly ends ~04:00 UTC Sun; biweekly ~16:00 UTC Sat.
#
# Four schedules: one crawl shortly after each contest type ends, and one
# re-crawl of that contest type ~24h later once LeetCode's cheater purge has
# settled. Every slot runs `predict-recent`, which also predicts any contest
# from the last 72h that is still missing — so a slot that got blocked (or that
# GitHub delayed or dropped) is picked up by the next one, and once everything
# is predicted a slot is a cheap no-op.
#
# Minutes are deliberately off :00/:30, the times GitHub's docs name as most
# likely to delay or drop scheduled runs. The two refresh crons are matched by
# string in crawl-attempt.yml — change them together.
#
# Each slot tries up to four runners: if an attempt is refused by Cloudflare
# (exit 75), the next attempt runs as a new job on a fresh VM with a different
# IP. See crawl-attempt.yml for why that beats retrying in place.
on:
  schedule:
    - cron: "41 4 * * 0"    # weekly:   ~40m after it ends
    - cron: "13 4 * * 1"    # weekly:   ~+24h, refresh (post-purge, final)
    - cron: "41 16 * * 6"   # biweekly: ~40m after it ends
    - cron: "13 16 * * 0"   # biweekly: ~+24h, refresh (post-purge, final)
  workflow_dispatch:
    inputs:
      slug:
        description: "Contest slug (blank = every recent contest still missing)"
        required: false
      limit:
        description: "Top-N only (blank = full contest)"
        required: false
      force:
        description: "Re-predict even if already done (true/false; blank slug = latest)"
        required: false
        default: "false"

concurrency:
  group: crawl-predict
  cancel-in-progress: false

jobs:
  attempt-1:
    name: Attempt 1
    uses: ./.github/workflows/crawl-attempt.yml
    with:
      attempt: 1
    secrets: inherit

  attempt-2:
    name: Attempt 2 (fresh runner)
    needs: attempt-1
    if: needs.attempt-1.outputs.outcome == 'blocked'
    uses: ./.github/workflows/crawl-attempt.yml
    with:
      attempt: 2
    secrets: inherit

  attempt-3:
    name: Attempt 3 (fresh runner)
    needs: attempt-2
    if: needs.attempt-2.outputs.outcome == 'blocked'
    uses: ./.github/workflows/crawl-attempt.yml
    with:
      attempt: 3
    secrets: inherit

  attempt-4:
    name: Attempt 4 (fresh runner, final)
    needs: attempt-3
    if: needs.attempt-3.outputs.outcome == 'blocked'
    uses: ./.github/workflows/crawl-attempt.yml
    with:
      attempt: 4
      final: true
    secrets: inherit
